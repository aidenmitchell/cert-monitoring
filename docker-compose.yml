services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ct}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      # Required when a password is set, otherwise the default user is open.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface
      - "127.0.0.1:9000:9000"   # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # To store the CT dataset on a specific host/NAS directory instead, comment
      # the line above and uncomment + edit this (the ClickHouse image chowns it
      # on startup, so no manual permission setup needed):
      # - /mnt/nas/cert-monitoring/clickhouse:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: `ctmon seed` writes ct_index.json at each log's current tip so
  # certstream's recovery resumes from "now" instead of backfilling from index 0.
  # Idempotent — only fills logs missing from the file.
  seed:
    build: ./ctmon
    image: ctmon:latest
    command: ["seed"]
    environment:
      CT_INDEX_FILE: /state/ct_index.json
    volumes:
      - certstream-state:/state

  certstream:
    image: 0rickyy0/certstream-server-go:latest
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"   # WebSocket lite stream at /
    volumes:
      - ./certstream/config.yaml:/app/config/config.yaml:ro
      - certstream-state:/app/state   # persisted recovery checkpoint
      # Host/NAS path alternative for the checkpoint (must be writable by uid
      # 10001 — the certstream container user — e.g. `chown -R 10001 <dir>`):
      # - /mnt/nas/cert-monitoring/certstream-state:/app/state

  # Unified data plane: ingests the certstream lite stream into ClickHouse AND
  # detects/repairs index-sequence gaps by fetching missing entries directly
  # from each CT log (RFC6962 + tiled). Runs both concurrently.
  monitor:
    build: ./ctmon
    image: ctmon:latest
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
      certstream:
        condition: service_started
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"          # native protocol
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ct}
      CERTSTREAM_WS_URL: ws://certstream:8080/
      # ClickHouse insert guidance: 10k-100k rows per insert, batched client-side.
      BATCH_SIZE: "50000"              # flush at this many rows...
      BATCH_SECONDS: "5"               # ...or this interval, whichever first
      MAX_BUFFER: "500000"             # retry buffer cap before dropping oldest
      BACKFILL_INTERVAL: "2m"          # detect+repair cadence (cheap; tune to taste)
      MAX_GAP: "100000"                # per-log gap cap; larger gaps logged, skipped
      BACKFILL_CONCURRENCY: "6"        # logs repaired in parallel
      BACKFILL_RETRIES: "6"            # per-fetch retries (429/transient) w/ jittered backoff + Retry-After

  # Web UI: Grafana with the official ClickHouse datasource + a starter dashboard,
  # both auto-provisioned. Open http://localhost:3000 (anonymous view enabled;
  # log in as admin / CLICKHOUSE_PASSWORD to edit).
  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Host/NAS path alternative (must be writable by uid 472 — the grafana
      # container user — e.g. `chown -R 472 <dir>`):
      # - /mnt/nas/cert-monitoring/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  # Minimal domain-lookup web UI: enter a domain (optionally + subdomains) and
  # get certificate stats. http://localhost:8088
  webui:
    build: ./webui
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ct}
      LISTEN_ADDR: ":8088"
    ports:
      - "127.0.0.1:8088:8088"

# Docker-managed named volumes (default). To put data on a specific host/NAS
# directory instead, use the commented bind-mount examples in each service above.
#
# NAS caveat: ClickHouse wants fast LOCAL disk. Running clickhouse-data over
# NFS/SMB can hurt performance and, worse, break its file locking — keep the CT
# dataset on a local SSD if you can, and use the NAS for backups/exports. The
# small certstream-state and grafana-data volumes are fine on a NAS.
volumes:
  clickhouse-data:
  certstream-state:
  grafana-data:
