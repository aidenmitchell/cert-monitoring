services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ct}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      # Required when a password is set, otherwise the default user is open.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface
      - "127.0.0.1:9000:9000"   # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: `ctmon seed` writes ct_index.json at each log's current tip so
  # certstream's recovery resumes from "now" instead of backfilling from index 0.
  # Idempotent — only fills logs missing from the file.
  seed:
    build: ./ctmon
    image: ctmon:latest
    command: ["seed"]
    environment:
      CT_INDEX_FILE: /state/ct_index.json
    volumes:
      - certstream-state:/state

  certstream:
    image: 0rickyy0/certstream-server-go:latest
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"   # WebSocket lite stream at /
    volumes:
      - ./certstream/config.yaml:/app/config/config.yaml:ro
      - certstream-state:/app/state   # persisted recovery checkpoint

  # Unified data plane: ingests the certstream lite stream into ClickHouse AND
  # detects/repairs index-sequence gaps by fetching missing entries directly
  # from each CT log (RFC6962 + tiled). Runs both concurrently.
  monitor:
    build: ./ctmon
    image: ctmon:latest
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
      certstream:
        condition: service_started
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"          # native protocol
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ct}
      CERTSTREAM_WS_URL: ws://certstream:8080/
      # ClickHouse insert guidance: 10k-100k rows per insert, batched client-side.
      BATCH_SIZE: "50000"              # flush at this many rows...
      BATCH_SECONDS: "5"               # ...or this interval, whichever first
      MAX_BUFFER: "500000"             # retry buffer cap before dropping oldest
      BACKFILL_INTERVAL: "2m"          # detect+repair cadence (cheap; tune to taste)
      MAX_GAP: "100000"                # per-log gap cap; larger gaps logged, skipped
      BACKFILL_CONCURRENCY: "6"        # logs repaired in parallel
      BACKFILL_RETRIES: "6"            # per-fetch retries (429/transient) w/ jittered backoff + Retry-After

volumes:
  clickhouse-data:
  certstream-state:
