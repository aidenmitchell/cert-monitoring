apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-ct
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: default
      defaultDatabase: ct
    secureJsonData:
      # Interpolated from the grafana container's environment at provision time.
      password: $CLICKHOUSE_PASSWORD
