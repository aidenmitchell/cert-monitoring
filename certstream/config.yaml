webserver:
  listen_addr: "0.0.0.0"
  listen_port: 8080
  real_ip: false
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  cert_path: ""
  cert_key_path: ""
  compression_enabled: false

prometheus:
  enabled: false
  listen_addr: "0.0.0.0"
  listen_port: 8080
  metrics_url: "/metrics"
  expose_system_metrics: false
  real_ip: false
  whitelist:
    - "127.0.0.1/8"

general:
  # Follow the default CT logs from Google's Chrome log list.
  disable_default_logs: false
  drop_old_logs: true

  buffer_sizes:
    websocket: 300
    ctlog: 1000
    # Central broadcast queue — raise if the ingester can't keep up.
    broadcastmanager: 10000

  # Resume from the last processed index per log after a restart, filling the
  # downtime gap. The `seed` service writes ct_index.json at each log's current
  # tip on first start, so enabling this does NOT trigger a full backfill.
  recovery:
    enabled: true
    ct_index_file: "/app/state/ct_index.json"
